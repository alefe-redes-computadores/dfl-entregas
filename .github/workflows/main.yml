name: Build Android APK DFL Entregas

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Instalar Dependências
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Build estático do Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.NEXT_PUBLIC_GEOAPIFY_API_KEY }}

      - name: Validar export web
        run: |
          test -d out
          test -f out/index.html
          echo "Export Next.js válido."

      - name: Criar e sincronizar Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          npx cap doctor android || true

      - name: Gerar ícones e splash
        run: |
          mkdir -p assets
          cp public/icon-512.png assets/icon.png
          cp public/icon-512.png assets/splash.png
          npx @capacitor/assets generate --android

      - name: Gerar ícone de notificações
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/generate-notification-icon.py public/icon-512.png android/app/src/main/res ic_stat_dfl
          test -s android/app/src/main/res/drawable-mdpi/ic_stat_dfl.png
          test -s android/app/src/main/res/drawable-xxxhdpi/ic_stat_dfl.png

      - name: Restaurar assinatura de teste
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore

      - name: Compilar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Validar APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DFL-Entregas-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
