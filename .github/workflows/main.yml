name: Build Android APK DFL Entregas

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Instalar Dependências
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Gerar identidade visual do app
        run: |
          python3 scripts/generate-brand-assets.py dfl-entregas-icon-master.png public
          test -s public/icon-192.png
          test -s public/icon-512.png
          test -s public/icon-maskable-192.png
          test -s public/icon-maskable-512.png
          test -s public/apple-touch-icon.png
          test -s public/favicon.ico

      # O APK Capacitor é um cliente estático. As Route Handlers abaixo
      # pertencem exclusivamente ao deploy servidor e importam firebase-admin.
      # O checkout deste job é descartável, então isolamos app/api somente
      # durante a geração do APK sem alterar/remover as APIs do repositório.
      - name: Isolar APIs server-only do APK
        shell: bash
        run: |
          if [ -d app/api ]; then
            mkdir -p .dfl-apk-server-only
            mv app/api .dfl-apk-server-only/api
          fi
          test ! -d app/api
          test -f .dfl-apk-server-only/api/integration/events/route.ts
          test -f .dfl-apk-server-only/api/integration/outbox/drain/route.ts
          test -f .dfl-apk-server-only/api/integration/worker/route.ts
          echo "APIs server-only isoladas do build estático do APK."

      - name: Build estático do Next.js
        run: npm run build
        env:
          DFL_STATIC_EXPORT: '1'
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.NEXT_PUBLIC_GEOAPIFY_API_KEY }}

      - name: Validar export web
        run: |
          test -d out
          test -f out/index.html
          echo "Export Next.js válido."

      - name: Criar e sincronizar Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          npx cap doctor android || true

      - name: Gerar ícones e splash Android
        run: |
          mkdir -p assets

          # icon.png: ícone legado/fallback Android.
          cp public/icon-512.png assets/icon.png

          # O adaptive icon precisa receber foreground transparente.
          # NÃO usar icon-maskable aqui: ele já possui fundo #09090b
          # e safe-zone própria do PWA, o que causaria dupla moldura.
          cp dfl-entregas-icon-master.png assets/icon-only.png

          cp public/icon-512.png assets/splash.png

          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#09090b' \
            --iconBackgroundColorDark '#09090b'
          test -d android/app/src/main/res/mipmap-mdpi
          test -d android/app/src/main/res/mipmap-xxxhdpi

      - name: Gerar ícone de notificações
        run: |
          python3 -m pip install --disable-pip-version-check --quiet Pillow
          python3 scripts/generate-notification-icon.py public/icon-512.png android/app/src/main/res ic_stat_dfl
          test -s android/app/src/main/res/drawable-mdpi/ic_stat_dfl.png
          test -s android/app/src/main/res/drawable-xxxhdpi/ic_stat_dfl.png

      - name: Restaurar assinatura de teste
        run: |
          mkdir -p ~/.android
          echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
          test -s ~/.android/debug.keystore

      - name: Exibir fingerprints da assinatura Android
        shell: bash
        run: |
          echo "===== CERTIFICADO QUE ASSINARÁ O APK ====="
          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E 'Alias name:|SHA1:|SHA256:'
          echo "=========================================="

      - name: Compilar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Exibir certificado do APK gerado
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          echo "===== CERTIFICADO DO APK REAL ====="
          "$APKSIGNER" verify --print-certs "$APK"
          echo "==================================="

      - name: Validar APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DFL-Entregas-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
