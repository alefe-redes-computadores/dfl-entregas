name: Build Android APK DFL Entregas

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Instalar Dependências
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: Gerar identidade visual do app
        run: |
          python3 scripts/generate-brand-assets.py dfl-entregas-icon-master.png public
          test -s public/icon-192.png
          test -s public/icon-512.png
          test -s public/icon-maskable-192.png
          test -s public/icon-maskable-512.png
          test -s public/apple-touch-icon.png
          test -s public/favicon.ico

      # O APK Capacitor é um cliente estático. As Route Handlers abaixo
      # pertencem exclusivamente ao deploy servidor e importam firebase-admin.
      # O checkout deste job é descartável, então isolamos app/api somente
      # durante a geração do APK sem alterar/remover as APIs do repositório.
      - name: Isolar APIs server-only do APK
        shell: bash
        run: |
          if [ -d app/api ]; then
            mkdir -p .dfl-apk-server-only
            mv app/api .dfl-apk-server-only/api
          fi
          test ! -d app/api
          test -f .dfl-apk-server-only/api/integration/events/route.ts
          test -f .dfl-apk-server-only/api/integration/outbox/drain/route.ts
          test -f .dfl-apk-server-only/api/integration/worker/route.ts
          echo "APIs server-only isoladas do build estático do APK."

      - name: Build estático do Next.js
        run: npm run build
        env:
          DFL_STATIC_EXPORT: '1'
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}
          NEXT_PUBLIC_GEOAPIFY_API_KEY: ${{ secrets.NEXT_PUBLIC_GEOAPIFY_API_KEY }}

      - name: Validar export web
        run: |
          test -d out
          test -f out/index.html
          echo "Export Next.js válido."

      - name: Criar e sincronizar Android
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android
          npx cap doctor android || true

      # O Android é recriado acima em todo build.
      # Portanto este patch PRECISA acontecer depois do último cap sync
      # e antes de qualquer etapa Gradle.
      - name: Aplicar contrato nativo de System Bars
        shell: bash
        run: |
          node scripts/patch-android-system-bars.mjs
          grep -F 'WindowCompat.setDecorFitsSystemWindows' android/app/src/main/java/com/dfl/entregas/MainActivity.java
          grep -F 'setAppearanceLightStatusBars(false)' android/app/src/main/java/com/dfl/entregas/MainActivity.java

      - name: Gerar ícones e splash Android
        run: |
          mkdir -p assets

          # icon.png: ícone legado/fallback Android.
          cp public/icon-512.png assets/icon.png

          # O adaptive icon precisa receber foreground transparente.
          # NÃO usar icon-maskable aqui: ele já possui fundo #09090b
          # e safe-zone própria do PWA, o que causaria dupla moldura.
          cp dfl-entregas-icon-master.png assets/icon-only.png

          cp public/icon-512.png assets/splash.png

          npx @capacitor/assets generate --android \
            --iconBackgroundColor '#09090b' \
            --iconBackgroundColorDark '#09090b'
          test -d android/app/src/main/res/mipmap-mdpi
          test -d android/app/src/main/res/mipmap-xxxhdpi

      - name: Restaurar ícone Android de notificações
        shell: bash
        run: |
          set -euo pipefail
          test -s assets/android/ic_stat_dfl.xml
          mkdir -p android/app/src/main/res/drawable
          cp assets/android/ic_stat_dfl.xml android/app/src/main/res/drawable/ic_stat_dfl.xml
          test -s android/app/src/main/res/drawable/ic_stat_dfl.xml
          grep -F 'android:fillColor="#FFFFFFFF"' android/app/src/main/res/drawable/ic_stat_dfl.xml
          grep -F '"smallIcon": "ic_stat_dfl"' capacitor.config.json
          grep -F '"iconColor": "#F59E0B"' capacitor.config.json

      - name: Restaurar e fixar assinatura Android estável
        shell: bash
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEBUG_KEYSTORE_BASE64"

          KEYSTORE="$RUNNER_TEMP/dfl-entregas-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          test -s "$KEYSTORE"

          keytool -list \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android >/dev/null

          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle")
          text = path.read_text(encoding="utf-8")
          marker = "dflStableDebug"
          if marker in text:
              raise SystemExit("Contrato de assinatura já existe inesperadamente no Android recém-gerado.")

          block = r"""

          // DFL: assinatura debug estável para Firebase/Google Auth.
          android {
              signingConfigs {
                  dflStableDebug {
                      storeFile file(System.getenv("RUNNER_TEMP") + "/dfl-entregas-debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.dflStableDebug
                  }
              }
          }
          """
          path.write_text(text.rstrip() + block + "\n", encoding="utf-8")
          PY

          grep -F 'dflStableDebug' android/app/build.gradle
          grep -F 'dfl-entregas-debug.keystore' android/app/build.gradle

          echo "===== CERTIFICADO ESTÁVEL ESPERADO ====="
          keytool -list -v \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | grep -E 'Alias name:|SHA1:|SHA256:'
          echo "========================================="

      - name: Compilar APK debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew clean assembleDebug

      - name: Validar assinatura do APK gerado
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          KEYSTORE="$RUNNER_TEMP/dfl-entregas-debug.keystore"
          test -s "$APK"
          test -s "$KEYSTORE"

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          APKSIGNER="$(find "$SDK/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)"
          test -n "$APKSIGNER"

          EXPECTED_SHA1="$(keytool -exportcert -rfc \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | openssl x509 -noout -fingerprint -sha1 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_SHA256="$(keytool -exportcert -rfc \
            -keystore "$KEYSTORE" \
            -alias androiddebugkey \
            -storepass android \
            -keypass android | openssl x509 -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          CERTS="$($APKSIGNER verify --print-certs "$APK")"
          ACTUAL_SHA1="$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-1 digest: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          ACTUAL_SHA256="$(printf '%s\n' "$CERTS" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          test -n "$EXPECTED_SHA1"
          test -n "$EXPECTED_SHA256"
          test -n "$ACTUAL_SHA1"
          test -n "$ACTUAL_SHA256"

          echo "===== CERTIFICADO DO APK REAL ====="
          printf '%s\n' "$CERTS"
          echo "==================================="

          if [ "$EXPECTED_SHA1" != "$ACTUAL_SHA1" ]; then
            echo "ERRO: SHA-1 do APK diverge do keystore estável." >&2
            exit 1
          fi
          if [ "$EXPECTED_SHA256" != "$ACTUAL_SHA256" ]; then
            echo "ERRO: SHA-256 do APK diverge do keystore estável." >&2
            exit 1
          fi

          echo "ASSINATURA ANDROID VALIDADA: keystore e APK são idênticos."

      - name: Validar APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: DFL-Entregas-${{ github.run_number }}-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
