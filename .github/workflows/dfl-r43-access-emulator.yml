name: DFL R43 - Matriz de acessos (Emulator DEMO)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  access-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Dependencias locais
        run: npm ci
      - name: CLI de Firebase efemero e pacote de teste
        run: npm install --no-save --package-lock=false firebase-tools@14 @firebase/rules-unit-testing@4
      - name: Verificacoes offline
        run: |
          node scripts/verify-v111-r43-security-ui.cjs
          node scripts/test-v111-r43-holiday-cache.cjs
          node node_modules/typescript/bin/tsc --noEmit
      - name: Teste isolado de Rules - projeto demo
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8093
          GCLOUD_PROJECT: demo-dfl-entregas-r43
        run: npx firebase emulators:exec --only firestore --project demo-dfl-entregas-r43 --config firebase.r43-emulator.json 'node scripts/test-v111-r43-access-emulator.cjs'
