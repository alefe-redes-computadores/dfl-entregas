name: DFL V111 R39 — Auditoria sob demanda (DEMO)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dfl-r39-admission-manual
  cancel-in-progress: false
jobs:
  protected-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout read-only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Dependências congeladas
        run: npm ci --ignore-scripts
      - name: Contratos e concorrência R39
        run: |
          node scripts/verify-v111-r39-audit-admission.cjs
          node scripts/test-v111-r39-audit-admission-api.cjs
          node scripts/test-v111-r38-readiness-load.cjs
      - name: TypeScript integral
        run: node node_modules/typescript/bin/tsc --noEmit
      - name: PRE-APK completo (159 suítes)
        run: node scripts/pre-apk.cjs
      - name: Firebase Emulator de projeto DEMO, nunca produção
        env:
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8089
          GCLOUD_PROJECT: demo-dfl-entregas-r36
        run: npx --yes firebase-tools@14 emulators:exec --only firestore --project demo-dfl-entregas-r36 --config firebase.r36-emulator.json 'node scripts/test-v111-r36-refresh-emulator.cjs'
      - name: Revisão de integridade
        run: git diff --check
